[project]
name = "solothurn-slayer-bi"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "motley-slayer @ git+https://github.com/MotleyAI/slayer.git@516539dfec2979180695efa4351e0adccd6b2816",
  "duckdb==2.0.0", "duckdb-engine==0.17.0", "sqlalchemy==2.0.55",
  "sqlglot[c]==30.24.0", "pydantic==2.14.1", "mcp==1.30.0",
  "starlette==1.9.0", "uvicorn==0.54.0", "anyio==4.15.1",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slayer_app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
