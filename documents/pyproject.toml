[project]
name = "documents-mcp"
version = "0.1.0"
description = "Documents server of the prototype: corpora (acts, decisions), shared catalog and access control over MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==1.30.0", "starlette==1.9.0", "uvicorn==0.54.0",
  "pydantic==2.14.1", "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documents_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
